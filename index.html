<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Black</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: #000;
      color: #000;
      border-color: #000;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 300px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      outline: none;
      border: 1px solid #000;
      background: #000;
      color: #000;
    }

    .message {
      margin-top: 20px;
      display: none;
    }

    ::selection {
      background: #000;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="container">
    <input id="codeInput" type="text">
    <button onclick="unlock()"></button>

    <div class="message" id="message">
      <p>
        You found this because you knew the code.  
        Even in total darkness, I choose you.  
        Love doesn’t need light to exist.
      </p>
    </div>
  </div>

  <script>
    const correctCode = "SDGB-so-sarap";

    function unlock() {
      const input = document.getElementById("codeInput").value;
      const message = document.getElementById("message");

      if (input === correctCode) {
        message.style.display = "block";
      }
    }
  </script>

</body>
</html>
